[project]
name = "phasmid-profile-manager"
version = "0.1.0"
description = "Self-hosted, open-source antidetect browser profile manager built on Phasmid"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Phasmid Profile Manager Contributors" },
    { name = "Camoufox Profile Manager Contributors" },
]
keywords = [
    "phasmid",
    "antidetect",
    "browser-fingerprint",
    "chromium",
    "cdp",
    "fastapi",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    # Profiles are generated by phasmid-profile-gen (core/genprofile_driver.py,
    # run in a child process). Pinned exactly: the same seed must give the same
    # machine, and the location extra's data decides where an exit is placed.
    "phasmid-profile-gen[location]==0.1.1",
    # Release archives are .tar.zst.
    "zstandard>=0.25.0",
    # The CDP relay (api/routes/automation.py) and the graceful close.
    "websockets>=13",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1",
    "openpyxl>=3.1",
    "cryptography>=44.0",
    # argon2id password hashing for user accounts (OWASP first choice; memory-hard,
    # unlike bcrypt, and without bcrypt's 72-byte input truncation).
    "argon2-cffi>=23.1",
    "loguru>=0.7",
    "psutil>=6.1",
    # socks so a SOCKS5 proxy can be checked, not only HTTP ones.
    "httpx[socks]>=0.28",
    "packaging>=24.1",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    # Browser tests and the agent examples drive Phasmid over CDP with it.
    "playwright>=1.60",
]

[project.scripts]
phasmid-profile-manager = "phasmid_profile_manager.cli:main"
# Short alias.
phasmid-pm = "phasmid_profile_manager.cli:main"

[project.urls]
Homepage = "https://github.com/tintty1/phasmid-profile-manager"
Repository = "https://github.com/tintty1/phasmid-profile-manager"
Issues = "https://github.com/tintty1/phasmid-profile-manager/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phasmid_profile_manager"]
# The bundled web UI is generated (scripts/build_webui.py) and git-ignored, so
# include it explicitly when building a wheel.
artifacts = ["src/phasmid_profile_manager/webui/**"]

[tool.hatch.build.targets.sdist]
# Ship source only — keep the huge web build artifacts out of the sdist.
exclude = [
    "/web/node_modules",
    "/web/.next",
    "/web/out",
    "/src/phasmid_profile_manager/webui",
    "/dist",
    "/.venv",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/data",
    "/demo_data",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]
# UP042: str() of a StrEnum differs from a (str, Enum); stored values rely on the latter.
ignore = ["E501", "UP042", "UP046"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection helpers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: real Phasmid launch (opt-in, slow, needs an installed browser)",
]

[tool.mypy]
packages = ["phasmid_profile_manager"]
ignore_missing_imports = true
# Check our code only.
follow_imports = "silent"

[tool.coverage.run]
source = ["src/phasmid_profile_manager"]
