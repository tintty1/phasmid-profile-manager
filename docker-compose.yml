# Run it with:  docker compose up
# then open http://localhost:8000
#
# One service: the API and the web UI are served from one process on one port,
# so there is no second container and no CORS to configure.
#
# The port is published to loopback (127.0.0.1) only, because the app is open by
# default. Before exposing it beyond this host, create a user account
# (`docker compose exec app /app/.venv/bin/phasmid-pm user add <name>`) or set
# PPM_API_KEY, and set PPM_SECRET_KEY to encrypt proxy passwords at rest.
services:
  app:
    build: .
    # environment:
    # PPM_API_KEY: "change-me"
    # PPM_SECRET_KEY: "generate-with-fernet"
    # Set when a TLS-terminating proxy sits in front, so the session cookie
    # keeps its Secure flag even though this process sees plain HTTP.
    # PPM_SECURE_COOKIES: "1"
    volumes:
      # The database, the profiles, and the installed Phasmid release, so a
      # rebuild neither loses accounts nor downloads the browser again.
      - ppm-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    # Chrome's sandbox needs user namespaces, which the default profile blocks.
    security_opt:
      - seccomp:unconfined
    # Chrome renderers need more shared memory than the 64 MB default.
    shm_size: "2gb"
    # Reap exited Xvnc and browser children, which the app does not wait on.
    init: true
    restart: unless-stopped

volumes:
  ppm-data:
