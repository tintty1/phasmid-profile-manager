# Let browsers open as windows on this machine's Wayland desktop (sway, niri,
# GNOME, KDE...), as well as in the web UI's VNC viewer. Linux only.
#
#   docker compose -f docker-compose.yml -f docker-compose.desktop.yml up -d
#
# Run it from a shell inside your desktop session, so WAYLAND_DISPLAY and
# XDG_RUNTIME_DIR point at your compositor. Wayland has no access control
# beyond the socket's file permissions, so there is no xhost step.
#
# With this file, headed launches open a window by default; ask for
# {"mode": "virtual"} or {"mode": "headless"} at launch for the others. Without
# it, plain `docker compose up -d` serves virtual and headless only.
services:
  app:
    environment:
      # Headed launches default to a desktop window instead of a VNC display.
      CPM_VNC: "0"
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-1}
      XDG_RUNTIME_DIR: /run/user/0
    volumes:
      # Only the compositor socket, not the whole runtime directory.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-1}:/run/user/0/${WAYLAND_DISPLAY:-wayland-1}
