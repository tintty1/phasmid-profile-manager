name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build & attach wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The build script needs only the standard library, so no `uv sync`.
      - name: Build the web UI into the package
        run: python3 scripts/build_webui.py
      - name: Build wheel (from source, includes the bundled UI) and sdist
        run: |
          uv build --wheel
          uv build --sdist
      # Installs the wheel the way a user would, from PyPI dependencies only.
      - name: Smoke test the wheel in a clean environment
        run: |
          uv venv --python 3.12 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/phasmid-profile-manager --help
          /tmp/wheel-env/bin/phasmid-pm --help
          /tmp/wheel-env/bin/python -m phasmid_profile_manager --help
          test -f "$(/tmp/wheel-env/bin/python -c 'import phasmid_profile_manager, pathlib; print(pathlib.Path(phasmid_profile_manager.__file__).parent / "webui" / "index.html")')"
      - name: Checksum Python distributions
        working-directory: dist
        run: |
          for artifact in *.whl *.tar.gz; do sha256sum "$artifact" > "$artifact.sha256"; done
      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
